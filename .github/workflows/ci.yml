# Proves the brief's rule: runs on a clean Mac or Linux box with only
# Python 3 + bash, using nothing but setup.sh and run.sh.
name: ci
on: [push, pull_request]

jobs:
  clean-machine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (offline, synthetic fixtures)
        run: ./run.sh test
      - name: Setup from scratch (downloads the dataset + 2 sample videos)
        run: ./setup.sh --videos 2
      - name: Smoke test CLI and web server
        run: |
          ./run.sh stats
          ./run.sh search pour water --scene Kitchen --limit 3
          PORT=8123 ./run.sh serve --quiet &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8123/healthz && break; sleep 0.5; done
          curl -fs "http://127.0.0.1:8123/api/clips?q=door&scene=Kitchen" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['total'] > 0; print(d['total'], 'clips')"

  oldest-python:
    runs-on: ubuntu-latest
    container: python:3.8-slim   # no curl, no git extras: just Python + bash
    steps:
      - uses: actions/checkout@v4
      - run: ./run.sh test
      - run: ./setup.sh --videos 0 && ./run.sh stats
