# Render Blueprint (Dashboard -> New -> Blueprint -> pick this repo).
# Free web services sleep after 15 min idle; the next request takes ~30-60 s.
services:
  - type: web
    name: charades-label-explorer
    runtime: python
    plan: free
    buildCommand: ./setup.sh --videos 16
    startCommand: ./run.sh serve --quiet
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      # HTTP Basic auth keeps the instance private to reviewers, because the
      # Charades license does not allow publicly re-hosting the data.
      # Render generates the password; read it under Environment.
      - key: EXPLORER_USER
        value: reviewer
      - key: EXPLORER_PASSWORD
        generateValue: true
