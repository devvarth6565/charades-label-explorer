# Render Blueprint (Dashboard -> New -> Blueprint -> pick this repo).
# Free web services sleep after 15 min idle; the next request takes ~30-60 s.
services:
  - type: web
    name: charades-label-explorer
    runtime: python
    plan: free
    buildCommand: ./setup.sh --videos 16
    startCommand: ./run.sh serve --quiet
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Open demo for reviewers (kept out of search engines via robots.txt and
      # noindex headers). To require a login instead, add EXPLORER_PASSWORD
      # (user "reviewer") or EXPLORER_AUTH=user:password here.
